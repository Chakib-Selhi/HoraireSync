spring:
  application:
    name: horairesync
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  # Railway (and most hosts) give the port in $PORT
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

horairesync:
  # Origins allowed to call the API from a browser, comma separated; patterns such as
  # https://horairesync-*.vercel.app are accepted for Vercel preview deployments
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cache:
    ttl: 24h
    maximum-size: 2000
  http:
    user-agent: "HoraireSync/0.1 (+https://github.com/Chakib-Selhi/HoraireSync; student portfolio project)"
    timeout: 8s
    # Minimum delay between two requests to the same host
    default-crawl-delay: 5s
    crawl-delays:
      # robots.txt of etudier.uqam.ca asks for Crawl-delay: 10
      "[etudier.uqam.ca]": 10s
  uqam:
    base-url: https://etudier.uqam.ca
  # Schools listed in the UI that have no adapter yet: the user switches to manual entry
  unsupported-schools:
    - { id: udem, name: "Université de Montréal" }
    - { id: concordia, name: "Concordia University" }
    - { id: mcgill, name: "McGill University" }
    - { id: ets, name: "École de technologie supérieure" }
    - { id: polymtl, name: "Polytechnique Montréal" }
    - { id: usherbrooke, name: "Université de Sherbrooke" }
    - { id: ulaval, name: "Université Laval" }
